<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Primary meta -->
    <title>Skeined — Get Early Access</title>
    <meta
      name="description"
      content="Skeined is the calmest way to import knitting and crochet patterns, keep your yarn in order, and never lose your place in a row. Join the waitlist for early access."
    />
    <meta name="theme-color" content="#8571b0" />
    <link rel="canonical" href="https://skeined.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Skeined" />
    <meta property="og:title" content="Skeined — Get Early Access" />
    <meta
      property="og:description"
      content="Skeined is the calmest way to import knitting and crochet patterns, keep your yarn in order, and never lose your place in a row. Join the waitlist for early access."
    />
    <!-- Absolute, not "/og-image.png": Open Graph does not resolve relative
         URLs, so every share of skeined.com previewed blank. -->
    <meta property="og:image" content="https://skeined.com/og-image.png" />
    <!-- The real dimensions of the current file. NOTE: 760x1152 is portrait;
         Facebook, WhatsApp and X all want landscape near 1200x630 for a
         summary_large_image card, so this one is cropped to a strip by every
         scraper. Replacing the asset is the actual fix — declaring honest
         dimensions just stops the crop being a surprise. -->
    <meta property="og:image:width" content="760" />
    <meta property="og:image:height" content="1152" />
    <meta property="og:image:alt" content="Skeined — keep your place, keep your peace." />
    <meta property="og:url" content="https://skeined.com/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Skeined — Get Early Access" />
    <meta
      name="twitter:description"
      content="Skeined is the calmest way to import knitting and crochet patterns, keep your yarn in order, and never lose your place in a row. Join the waitlist for early access."
    />
    <meta name="twitter:image" content="https://skeined.com/og-image.png" />

    <!-- Google Analytics 4.
         Guarded by hostname on purpose: `develop` deploys to
         staging.skeined.com, and without this every test click would land in
         the same property as real traffic and quietly skew it. Nothing loads
         at all off the live domain, so localhost stays clean too. -->
    <script>
      (function () {
        var live = ["skeined.com", "www.skeined.com"];
        if (live.indexOf(location.hostname) === -1) return;
        var id = "G-0XW5FENDFB";
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=" + id;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag("js", new Date());
        gtag("config", id);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: Deploy

# Publishes the site automatically:
#   push to main    -> production  (skeined.com,        public_html/)
#   push to develop -> staging     (staging.skeined.com, staging/)
# Both fire on merge of a Pull Request. Manual runs available under the Actions tab.
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

# One in-flight deploy per environment; a newer push supersedes an older one.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "name=production" >> "$GITHUB_OUTPUT"
            echo "target=public_html/" >> "$GITHUB_OUTPUT"
            echo "url=https://skeined.com/" >> "$GITHUB_OUTPUT"
          else
            echo "name=staging" >> "$GITHUB_OUTPUT"
            echo "target=public_html/staging.skeined.com/" >> "$GITHUB_OUTPUT"
            echo "url=https://staging.skeined.com/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the site
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # Staging must never be indexed by search engines. Production is left untouched.
      - name: Block search indexing on staging
        if: steps.env.outputs.name == 'staging'
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - name: Deploy dist/ to ${{ steps.env.outputs.name }} over SSH (rsync, retried)
        env:
          # FTP_SERVER / FTP_USERNAME are reused as the SSH host + user (port 22).
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.FTP_SERVER }}
          REMOTE_USER: ${{ secrets.FTP_USERNAME }}
          # Path is relative to the cPanel account home (/home/<user>/).
          TARGET: ${{ steps.env.outputs.target }}
        run: |
          set -uo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Fail fast on a dropped connection (cPHulk/fail2ban can DROP an IP),
          # keep long transfers alive, and auto-trust the host key on first use.
          RSH="ssh -p 22 -i $HOME/.ssh/deploy_key \
               -o StrictHostKeyChecking=accept-new \
               -o ConnectTimeout=25 \
               -o ServerAliveInterval=15 -o ServerAliveCountMax=4"

          # -rlzc: recurse, keep symlinks, compress, checksum-compare. No --delete:
          # we only upload/update, never remove existing server files.
          attempt=1; max=3
          until rsync -rlzc --exclude='.well-known/' -e "$RSH" \
                      dist/ "$REMOTE_USER@$REMOTE_HOST:$TARGET"; do
            code=$?
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::rsync failed after $max attempts (last exit $code)"
              exit "$code"
            fi
            echo "::warning::rsync attempt $attempt failed (exit $code) — retrying in 20s…"
            attempt=$((attempt + 1)); sleep 20
          done
          echo "rsync succeeded on attempt $attempt"

      - name: Deploy summary
        run: echo "✅ Deployed \`${{ github.sha }}\` to **${{ steps.env.outputs.name }}** → ${{ steps.env.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

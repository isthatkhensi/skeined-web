name: Deploy to cPanel

# Publishes the site on every push to `main`.
# You can also trigger it manually from the GitHub "Actions" tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Prevent two deploys running at once (a fast follow-up push cancels the older run).
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Deploy dist/ to cPanel over SSH (rsync)
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          # FTP_SERVER / FTP_USERNAME are reused here as the SSH host + user
          # (host = skeined.com, user = your cPanel username). Port 22 = SSH.
          REMOTE_HOST: ${{ secrets.FTP_SERVER }}
          REMOTE_USER: ${{ secrets.FTP_USERNAME }}
          REMOTE_PORT: "22"
          SOURCE: dist/
          # Relative to the cPanel account home (/home/<user>/), so this is public_html.
          TARGET: public_html/
          # Default rsync args (no --delete): uploads/updates changed files only,
          # never removes existing server files. Excludes cPanel-managed AutoSSL dir.
          EXCLUDE: ".well-known/"
